# Build the .nvda-addon and create a GitHub release when a version tag is pushed.
#
# Trigger: push a tag matching v*.*.* (e.g. v1.0.1, v1.1.0, v2.0.0).
#
# Result: a GitHub release at that tag with two .nvda-addon assets attached:
#   - TextMarksTheSpot-<version>.nvda-addon (versioned, for archival)
#   - TextMarksTheSpot.nvda-addon (unversioned — keeps the "always latest"
#     download URL stable across releases)
#
# Manual fallback: if this workflow ever fails, the same build can be done
# locally with `scons` and a release created with `gh release create`.
#
# SUPPLY-CHAIN HARDENING (security audit, 2026-09-24). Three things, each for a
# reason worth keeping:
#
#   1. TWO JOBS. Everything that runs third-party code (pip, choco, SCons, the
#      tests) happens in `build`, which holds a READ-ONLY token. Only `publish`
#      holds contents: write, and it runs nothing but gh on an artifact that
#      was already built. A compromised build dependency can no longer use the
#      release token to rewrite what users download.
#   2. PINNED. Actions are pinned to full commit SHAs (a tag can be moved to
#      new code; a SHA cannot), and pip and choco install exact versions.
#      Bumping one is a deliberate edit, the same policy tests.yml applies to
#      ruff. The versions match the last release that built cleanly (v1.0.16).
#   3. THE TAG IS DATA, NOT CODE. `${{ github.ref_name }}` used to be pasted
#      straight into PowerShell source, and git accepts `$(`, `"` and `;` in a
#      ref name, so a crafted tag could run commands on the runner. It now
#      arrives through the environment and is validated as plain semver before
#      anything uses it. Only someone who can already push could create such a
#      tag, so this is hardening rather than a hole, but it costs nothing.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Validate the tag is plain semver
        run: |
          if ($env:TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Error "Tag is not of the form vX.Y.Z: $env:TAG"
            exit 1
          }

      - name: Check out source at the tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install gettext (provides msgfmt + xgettext for SCons)
        run: choco install gettext --version 1.0.0.20260310 --no-progress -y

      - name: Install Python build deps
        run: python -m pip install "scons==4.10.1" "markdown==3.10.2" "pytest==9.0.2"

      - name: Run unit tests
        run: python -B -m pytest tests/ -q

      - name: Build add-on with SCons
        run: scons

      - name: Verify built filename matches the pushed tag
        run: |
          $version = $env:TAG.Substring(1)
          $expected = "TextMarksTheSpot-$version.nvda-addon"
          if (-not (Test-Path -LiteralPath $expected)) {
            Write-Error "Built file not found: $expected (tag=$env:TAG). Make sure buildVars.py addon_version matches the tag."
            exit 1
          }
          Copy-Item -LiteralPath $expected -Destination "TextMarksTheSpot.nvda-addon" -Force
          Write-Host "OK: $expected"

      - name: Hand the built files to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: addon
          path: |
            TextMarksTheSpot-*.nvda-addon
            TextMarksTheSpot.nvda-addon
            changelog.md
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Fetch the built files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: addon

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = $env:TAG.Substring(1)
          gh release create $env:TAG `
            "TextMarksTheSpot-$version.nvda-addon" `
            "TextMarksTheSpot.nvda-addon" `
            --title $env:TAG `
            --notes-file changelog.md
