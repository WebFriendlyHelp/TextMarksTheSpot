# Run the test suite on every push and pull request.
#
# Why this exists separately from release.yml: that workflow only fires on a
# v*.*.* tag, so before this file the first thing to notice a broken test was
# a release. This one gates the commit instead.
#
# It deliberately runs on windows-latest even though the tests are pure Python
# and need no NVDA. The add-on only ever runs on Windows, several tests reach
# for APPDATA and Windows path shapes, and a green run here has to mean the
# same thing a green run on the developer's machine means.

name: Tests

on:
  push:
    branches:
      - '**'
  pull_request:

# A push to a branch that already has a run in flight cancels the older one.
# Keying on head_ref for pull requests means a PR from a branch in this repo
# shares a group with that branch's own push run instead of doubling it. Only
# branch pushes are listed above, so this never races the tag-triggered
# release.yml.
concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # ruff is PINNED and pytest is not, deliberately. A newer ruff ships new
      # default rules, so an unpinned install makes an unrelated push fail lint
      # on code nobody touched: the first run of this workflow drew 218 errors
      # from 0.16.7 against a tree that 0.14.5 called clean. Bumping the pin is
      # a deliberate act that comes with a diff to clean up. pytest stays open
      # because a new pytest breaking this suite is something worth hearing
      # about immediately.
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest "ruff==0.14.5"

      # -B matters. CPython validates a .pyc against source mtime and SIZE, so
      # a checkout that writes several files within the same second can leave a
      # cache entry that looks current for code that was never loaded. Cheap
      # insurance, and it keeps the CI command identical to the documented
      # local one.
      - name: Run unit tests
        run: python -B -m pytest tests/ -q

      # The suite has three times been shown to pass with a safety input
      # deleted, so "the tests are green" is not by itself evidence. This
      # re-runs the suite against deliberately sabotaged source and fails if
      # any sabotage goes unnoticed. It edits files in the workspace and
      # restores them in a finally; that is safe on a throwaway runner.
      - name: Prove the tests fail when their rule is deleted
        run: python -B tests/sabotage_check.py

      - name: Lint
        run: python -m ruff check .
