name = tmts_probe_field_stack
summary = TMTS probe: control field stack vs NVDAObjectAtStart
description = "Walks the first 20 paragraphs of the current page and logs, per chunk, the control field stack roles, heading level and its type, whether the field stack and NVDAObjectAtStart agree on role and heading level, and the wall-clock cost of each. Read-only; no cursor moves; no speech; no tones. Press NVDA+shift+f on a loaded page, then check the NVDA log for TMTS probe-fields entries."
author = Casey Mathews <help@webfriendlyhelp.com>
url = https://github.com/caseyamathews/text-marks-the-spot
version = 0.1.0
minimumNVDAVersion = 2024.1
lastTestedNVDAVersion = 2026.2
